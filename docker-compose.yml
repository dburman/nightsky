# Docker Compose for running nightsky on a Raspberry Pi (linux/arm64).
# Pulls the pre-built image from GHCR — no local build required.
#
# Prerequisites:
#   1. Copy and edit your config:
#      cp configs/nightsky.example.yaml nightsky.yaml
#
#   2. (Optional) log in to GHCR for private repos:
#      echo $CR_PAT | docker login ghcr.io -u USERNAME --password-stdin
#
#   3. Start both services:
#      docker compose up -d
#
#   4. Open the web UI:
#      http://<pi-hostname>:8080
#
#      The UI has no authentication and /api/config reports the camera's
#      coordinates, so the published port below is bound to the host's
#      loopback interface. To reach it from your phone or another machine,
#      either put an authenticating reverse proxy in front of it, or change
#      the mapping to "8080:8080" if you trust everything on your LAN.
#
#   Ownership: the containers run as uid 10001, so the bind-mounted
#   directories must be writable by it:
#      mkdir -p output darks && sudo chown -R 10001:10001 output darks
#   Alternatively set `user: "${UID}:${GID}"` on both services to run as
#   yourself.
#
# To pin a specific release, change the image tag from :latest to e.g. :v1.2.3

x-nightsky-image: &image ghcr.io/dburman/nightsky:latest

x-nightsky-common: &common
  image: *image
  restart: unless-stopped
  volumes:
    - ./nightsky.yaml:/etc/nightsky/nightsky.yaml:ro
    - ./output:/output
    - ./darks:/darks

services:

  # ── Capture service ────────────────────────────────────────────────────────
  # Runs the continuous capture loop. Requires camera hardware access.
  nightsky:
    <<: *common
    container_name: nightsky
    command: ["capture", "--config", "/etc/nightsky/nightsky.yaml"]

    # Camera access — uncomment the section matching your hardware.

    # --- Raspberry Pi CSI camera (libcamera / rpicam) ---
    devices:
      - /dev/video0:/dev/video0
      - /dev/vchiq:/dev/vchiq
      - /dev/vcsm-cma:/dev/vcsm-cma
    # Uncomment for ZWO USB camera instead (and comment out the above):
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb

    group_add:
      - video
    # privileged: true   # fallback if device mounts don't work on your Pi model

    security_opt:
      - no-new-privileges:true

    environment:
      - LIBCAMERA_LOG_LEVELS=ERROR,FATAL
      # AWS credentials for S3 upload (or mount ~/.aws instead):
      # - AWS_ACCESS_KEY_ID=
      # - AWS_SECRET_ACCESS_KEY=
      # - AWS_REGION=us-east-1

    deploy:
      resources:
        limits:
          memory: 512M

  # ── Web UI service ─────────────────────────────────────────────────────────
  # Serves the browser UI on port 8080. Reads from the shared output volume;
  # does not need camera access.
  nightsky-ui:
    <<: *common
    container_name: nightsky-ui
    # 0.0.0.0 inside the container is required for the published port to
    # reach it; exposure is controlled by the host-side bind below.
    command: ["serve", "--config", "/etc/nightsky/nightsky.yaml", "--addr", "0.0.0.0:8080"]
    ports:
      - "127.0.0.1:8080:8080"

    # The UI never writes outside the thumbnail cache and needs no devices.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
