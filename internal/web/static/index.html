<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nightsky</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%235b8dee'>✦</text></svg>">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #070b14;
  --surface: #0d1422;
  --card: #131d30;
  --card-hover: #1a2640;
  --border: #1e2d4a;
  --accent: #5b8dee;
  --accent-glow: rgba(91,141,238,0.15);
  --text: #dce6f5;
  --muted: #6b7d9e;
  --success: #3dba8c;
  --warning: #e8a030;
  --danger: #e05252;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono: 'SF Mono', 'Cascadia Code', Consolas, monospace;
  --radius: 8px;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.6;
}

/* ── Header ─────────────────────────────────────────────── */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(7,11,20,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 0 24px;
  height: 52px;
}

.logo {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--text);
  white-space: nowrap;
  text-decoration: none;
}
.logo span { color: var(--accent); }

.main-tabs {
  display: flex;
  gap: 2px;
  flex: 1;
}

.main-tabs button {
  background: none;
  border: none;
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
}
.main-tabs button:hover { color: var(--text); background: rgba(255,255,255,0.04); }
.main-tabs button.active { color: var(--accent); background: var(--accent-glow); }

.status-badge {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
}
.dot.live {
  background: var(--success);
  box-shadow: 0 0 6px var(--success);
  animation: pulse 2s ease-in-out infinite;
}
.dot.dead { background: var(--danger); }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ── Main ────────────────────────────────────────────────── */
main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px;
}

.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* ── Cards / Config ──────────────────────────────────────── */
.card-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 768px) { .card-grid { grid-template-columns: 1fr; } }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}
.card.full { grid-column: 1 / -1; }

.card-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

table.kv {
  width: 100%;
  border-collapse: collapse;
}
table.kv tr + tr td { border-top: 1px solid rgba(30,45,74,0.5); }
table.kv td { padding: 5px 0; vertical-align: top; }
table.kv td.k {
  color: var(--muted);
  width: 45%;
  padding-right: 12px;
  font-size: 13px;
}
table.kv td.v {
  color: var(--text);
  font-size: 13px;
  word-break: break-all;
}

/* Mode card two-column layout */
.mode-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 24px;
}
.mode-col-header {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 10px;
  letter-spacing: 0.06em;
}
.mode-grid .col:first-child {
  border-right: 1px solid var(--border);
  padding-right: 24px;
}

/* Badges */
.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 4px;
  letter-spacing: 0.03em;
}
.badge.green { background: rgba(61,186,140,0.15); color: var(--success); }
.badge.gray  { background: rgba(107,125,158,0.15); color: var(--muted); }
.badge.blue  { background: var(--accent-glow); color: var(--accent); }

/* Mono values */
.mono { font-family: var(--mono); font-size: 12px; }

/* ── Captures ────────────────────────────────────────────── */
.captures-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.captures-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}

.btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  font: inherit;
  font-size: 12px;
  font-weight: 500;
  padding: 5px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.btn:hover { background: var(--card-hover); border-color: var(--accent); }

/* Calendar date picker */
.cal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  max-width: 340px;
  margin-bottom: 16px;
}
.cal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.cal-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}
.cal-nav {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font: inherit;
  font-size: 14px;
  width: 26px;
  height: 26px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.cal-nav:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.cal-nav:disabled { opacity: 0.3; cursor: default; }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}
.cal-dow {
  text-align: center;
  font-size: 10px;
  font-weight: 600;
  color: var(--muted);
  padding: 2px 0;
}
.cal-day {
  text-align: center;
  font-size: 12px;
  padding: 5px 0;
  border-radius: 6px;
  color: var(--muted);
  opacity: 0.35;
}
.cal-day.has {
  opacity: 1;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.cal-day.has:hover { border-color: var(--accent); color: var(--accent); }
.cal-day.active {
  background: var(--accent-glow);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 700;
}
.cal-day .cal-dot {
  display: block;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--success);
  margin: 2px auto 0;
}

/* Sub-tabs */
.sub-tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.sub-tabs button {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 8px 16px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.sub-tabs button:hover { color: var(--text); }
.sub-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Image grid */
.img-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 8px;
}

.img-cell {
  position: relative;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  border-radius: 6px;
  background: var(--card);
  cursor: pointer;
}
.img-cell img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  opacity: 0;
  transition: transform 0.2s, opacity 0.3s;
}
.img-cell img.loaded { opacity: 1; }
.img-cell:hover img { transform: scale(1.04); }

.img-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,0.75));
  color: #fff;
  font-size: 11px;
  font-family: var(--mono);
  padding: 16px 8px 6px;
  opacity: 0;
  transition: opacity 0.15s;
}
.img-cell:hover .img-overlay { opacity: 1; }

/* Placeholder cells for unloaded images */
.img-placeholder {
  width: 100%;
  height: 100%;
  background: var(--surface);
  animation: shimmer 1.5s infinite;
}
@keyframes shimmer {
  0%   { background: var(--surface); }
  50%  { background: var(--card); }
  100% { background: var(--surface); }
}

/* Empty state */
.empty {
  padding: 48px 0;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}
.empty-icon { font-size: 36px; margin-bottom: 12px; }

.load-more-btn {
  display: block;
  margin: 20px auto;
  padding: 10px 28px;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
}
.load-more-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Video pane */
.video-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 24px 0;
}
.video-wrap video {
  /* Intrinsic size, shrunk to fit the container — never upscaled past the
     content's native resolution, never a fixed cap below it. */
  width: auto;
  height: auto;
  max-width: 100%;
  border-radius: var(--radius);
  background: #000;
  border: 1px solid var(--border);
}
.video-placeholder {
  padding: 48px 0;
  text-align: center;
  color: var(--muted);
}

.keogram-wrap {
  padding: 24px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.keogram-wrap img {
  /* Keograms are data strips: stretching to the container is intentional
     (hence pixelated rendering), just no arbitrary width cap. */
  width: 100%;
  max-width: 100%;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  image-rendering: pixelated;
}
.keogram-wrap img.native-fit {
  /* Photographic outputs (star trails): intrinsic size, shrink-to-fit,
     never upscaled. */
  width: auto;
  height: auto;
  image-rendering: auto;
}
.keogram-label {
  width: 100%;
  max-width: 100%;
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
}

/* ── Lightbox ─────────────────────────────────────────────── */
#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 500;
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(6px);
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#lightbox.open { display: flex; }

#lb-img {
  max-width: 92vw;
  max-height: 82vh;
  object-fit: contain;
  border-radius: 4px;
  box-shadow: 0 8px 48px rgba(0,0,0,0.7);
}

.lb-controls {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 16px;
}
.lb-btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  font: inherit;
  font-size: 20px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  transition: background 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.lb-btn:hover { background: var(--card-hover); }
.lb-counter { color: var(--muted); font-size: 13px; }
.lb-close {
  position: absolute;
  top: 16px;
  right: 20px;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 24px;
  cursor: pointer;
  line-height: 1;
  transition: color 0.15s;
}
.lb-close:hover { color: var(--text); }
.lb-time {
  color: var(--muted);
  font-family: var(--mono);
  font-size: 12px;
  margin-top: 6px;
}

/* ── Loading spinner ──────────────────────────────────────── */
.spinner {
  width: 28px;
  height: 28px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 32px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Live view ────────────────────────────────────────────── */
.live-layout {
  display: grid;
  grid-template-columns: 1fr 280px;
  gap: 16px;
  align-items: start;
}
@media (max-width: 900px) { .live-layout { grid-template-columns: 1fr; } }

.live-frame-wrap {
  position: relative;
  background: #000;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
  aspect-ratio: 4/3;
  display: flex;
  align-items: center;
  justify-content: center;
}
.live-frame-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
.live-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.live-age {
  font-size: 12px;
  color: var(--muted);
  font-family: var(--mono);
  margin-left: auto;
}
.live-offline {
  padding: 64px 0;
  text-align: center;
  color: var(--muted);
}
.metrics-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.metrics-card .card-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.metric-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid rgba(30,45,74,0.4);
  font-size: 13px;
}
.metric-row:last-child { border-bottom: none; }
.metric-label { color: var(--muted); }
.metric-value { color: var(--text); font-family: var(--mono); font-size: 12px; }
.cloud-bar-wrap {
  width: 64px;
  height: 6px;
  background: var(--surface);
  border-radius: 3px;
  overflow: hidden;
  display: inline-block;
  vertical-align: middle;
  margin-left: 6px;
}
.cloud-bar {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width 0.4s;
}
</style>
</head>
<body>

<header>
  <a class="logo" href="/"><span>✦</span> Nightsky</a>
  <div class="main-tabs">
    <button id="tab-live" class="active" onclick="showTab('live')">Live</button>
    <button id="tab-captures" onclick="showTab('captures')">Captures</button>
    <button id="tab-config" onclick="showTab('config')">Configuration</button>
  </div>
  <div class="status-badge">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">connecting…</span>
  </div>
</header>

<main>
  <!-- Live tab -->
  <div id="pane-live" class="tab-pane active">
    <div id="live-content"></div>
  </div>

  <!-- Captures tab -->
  <div id="pane-captures" class="tab-pane">
    <div class="captures-header">
      <span class="captures-title">Captures</span>
      <button class="btn" onclick="loadCaptures(true)">Refresh ↺</button>
    </div>
    <div id="captures-content"><div class="spinner"></div></div>
  </div>

  <!-- Configuration tab -->
  <div id="pane-config" class="tab-pane">
    <div id="config-content"><div class="spinner"></div></div>
  </div>
</main>

<!-- Lightbox -->
<div id="lightbox" role="dialog" aria-modal="true">
  <button class="lb-close" onclick="lbClose()" title="Close">✕</button>
  <img id="lb-img" src="" alt="">
  <div class="lb-time" id="lb-time"></div>
  <div class="lb-controls">
    <button class="lb-btn" onclick="lbNav(-1)" title="Previous">‹</button>
    <span class="lb-counter" id="lb-counter"></span>
    <button class="lb-btn" onclick="lbNav(1)" title="Next">›</button>
  </div>
</div>

<script>
'use strict';

/* ── Utilities ──────────────────────────────────────────── */
function fmtDur(ns) {
  if (typeof ns !== 'number') return String(ns);
  const s = ns / 1e9;
  if (s >= 1) return (s % 1 === 0 ? s : +s.toFixed(1)) + 's';
  return Math.round(ns / 1e6) + 'ms';
}

function badge(v, onLabel = 'enabled', offLabel = 'disabled') {
  return v
    ? `<span class="badge green">${onLabel}</span>`
    : `<span class="badge gray">${offLabel}</span>`;
}

function kv(pairs) {
  return '<table class="kv">' + pairs.map(([k, v]) =>
    `<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`
  ).join('') + '</table>';
}

// esc escapes for both element and quoted-attribute context. The quote
// characters matter: esc() is interpolated into src="..." and data-src="..."
// attributes built from filenames, and a filename containing a double quote
// would otherwise close the attribute and inject markup.
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ── Tab routing ────────────────────────────────────────── */
let capturesLoaded = false;

/* ── Status ─────────────────────────────────────────────── */
async function checkStatus() {
  const dot  = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  try {
    const res = await fetch('/api/status');
    if (!res.ok) throw new Error();
    const data = await res.json();
    dot.className  = 'dot live';
    // Release builds are stamped from the git tag (v0.1.0); show the bare number.
    text.textContent = `${String(data.version).replace(/^v/, '')} · ${data.camera_type}`;
  } catch {
    dot.className  = 'dot dead';
    text.textContent = 'offline';
  }
}

/* ── Config ─────────────────────────────────────────────── */
function renderConfig(cfg) {
  const c = cfg.camera;
  const loc = cfg.location;
  const out = cfg.output;
  const tl  = cfg.output.timelapse;
  const up  = cfg.upload;
  const dk  = cfg.dark;
  const fl  = cfg.flat;

  const flipLabels = ['none', 'horizontal', 'vertical', 'both'];
  const flipLabel = flipLabels[c.flip] || String(c.flip);

  function modeKV(m) {
    return kv([
      ['Exposure',          `<span class="mono">${fmtDur(m.exposure)}</span>`],
      ['Max Exposure',      `<span class="mono">${fmtDur(m.max_exposure)}</span>`],
      ['Gain',              esc(m.gain)],
      ['Max Gain',          esc(m.max_gain)],
      ['Auto Exposure',     badge(m.auto_exposure)],
      ['Target Brightness', esc(m.target_brightness)],
      ['Delay',             `<span class="mono">${fmtDur(m.delay)}</span>`],
      ['Binning',           esc(m.binning) + '×'],
      ['WB Red / Blue',     `${m.wb_red} / ${m.wb_blue}`],
      ['Auto WB',           badge(m.awb)],
      ['Image Type',        `<span class="badge blue">${esc(m.image_type)}</span>`],
      ['JPEG Quality',      esc(m.quality)],
      ['Skip Frames',       esc(m.skip_frames)],
      ['Denoise',           `<span class="mono">${esc(m.denoise)}</span>`],
      ['Metering Zone',     `<span class="badge blue">${esc(m.metering_zone || 'full')}</span>`],
      ['Moon Boost',        m.moon_target_boost > 0 ? esc(m.moon_target_boost) : '—'],
      ['Save Raw (DNG)',    badge(m.save_raw)],
      ['Cooler',            badge(m.cooler_enabled)],
      ['Cooler Target',     m.cooler_enabled ? esc(m.cooler_target) + ' °C' : '—'],
    ]);
  }

  const html = `
    <div class="card-grid">

      <div class="card">
        <div class="card-title">Camera</div>
        ${kv([
          ['Type',          `<span class="badge blue">${esc(c.type)}</span>`],
          ['Index',         esc(c.index)],
          ['Device',        esc(c.device)],
          ['USB Bandwidth', esc(c.usb_bandwidth) + '%'],
          ['Flip',          esc(flipLabel)],
        ])}
      </div>

      <div class="card">
        <div class="card-title">Location</div>
        ${kv([
          ['Latitude',       `<span class="mono">${loc.latitude}°</span>`],
          ['Longitude',      `<span class="mono">${loc.longitude}°</span>`],
          ['Twilight Angle', `<span class="mono">${loc.angle}°</span>`],
          ['GPS Auto-location', badge(loc.gps)],
          ['GPS Address', loc.gps ? `<span class="mono">${esc(loc.gps_addr)}</span>` : '—'],
        ])}
      </div>

      <div class="card full">
        <div class="card-title">Capture Modes</div>
        <div class="mode-grid">
          <div class="col">
            <div class="mode-col-header">Night</div>
            ${modeKV(cfg.night)}
          </div>
          <div class="col">
            <div class="mode-col-header">Day</div>
            ${modeKV(cfg.day)}
          </div>
        </div>
      </div>

let activeSub    = 'video';
let dateImages   = {};  // cache: date -> {images, video}

async function loadCaptures(force) {
  capturesLoaded = true;
  if (force) {
    dateImages  = {};
    activeDate  = null;
    calView     = null;
  }

  const el = document.getElementById('captures-content');
  el.innerHTML = '<div class="spinner"></div>';

  try {
    const res = await fetch('/api/captures');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    capturesList = await res.json();
  } catch (e) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">⚠</div>Failed to load captures: ${esc(String(e))}</div>`;
    return;
  }

  if (capturesList.length === 0) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📷</div>No captures yet.</div>`;
    return;
  }

    activeDate = capturesList[0].date;
  }

  renderCaptures();
  await loadDateContent(activeDate);
}

/* Calendar month being displayed, as {y, m} with m 1-12. null = month of
   the active date. Kept outside renderCaptures so month navigation persists
   across re-renders. */
let calView = null;

// monthOf parses "YYYY-MM-DD" into {y, m} without Date-object timezone traps.
function monthOf(dateStr) {
  const [y, m] = dateStr.split('-').map(Number);
  return { y, m };
}

function monthKey(v) { return v.y * 12 + (v.m - 1); }

function calShift(delta) {
  calView = { ...(calView || monthOf(activeDate)) };
  calView.m += delta;
  while (calView.m > 12) { calView.m -= 12; calView.y++; }
  while (calView.m < 1)  { calView.m += 12; calView.y--; }
  renderCaptures();
  renderDateContent(activeDate);
}

function renderCalendar() {
  const byDate = {};
  capturesList.forEach(c => { byDate[c.date] = c; });
  // capturesList is newest-first: bounds of month navigation.
  const newest = monthOf(capturesList[0].date);
  const oldest = monthOf(capturesList[capturesList.length - 1].date);
  const view = calView || monthOf(activeDate);

  const monthName = new Date(view.y, view.m - 1, 1)
    .toLocaleString('default', { month: 'long', year: 'numeric' });
  const atOldest = monthKey(view) <= monthKey(oldest);
  const atNewest = monthKey(view) >= monthKey(newest);

  let cells = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa']
    .map(d => `<div class="cal-dow">${d}</div>`).join('');

  const firstDow = new Date(view.y, view.m - 1, 1).getDay();
  const daysInMonth = new Date(view.y, view.m, 0).getDate();
  for (let i = 0; i < firstDow; i++) cells += '<div></div>';
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${view.y}-${String(view.m).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const c = byDate[dateStr];
    if (!c) {
      cells += `<div class="cal-day">${day}</div>`;
      continue;
    }
    const active = dateStr === activeDate ? ' active' : '';
    const dot = c.has_video ? '<span class="cal-dot"></span>' : '';
    cells += `<div class="cal-day has${active}" title="${esc(dateStr)} · ${c.image_count} images"
      onclick="selectDate('${esc(dateStr)}')">${day}${dot}</div>`;
  }

  return `
    <div class="cal">
      <div class="cal-head">
        <button class="cal-nav" onclick="calShift(-1)" ${atOldest ? 'disabled' : ''} title="Earlier month">‹</button>
        <span class="cal-title">${esc(monthName)}</span>
        <button class="cal-nav" onclick="calShift(1)" ${atNewest ? 'disabled' : ''} title="Later month">›</button>
      </div>
      <div class="cal-grid">${cells}</div>
    </div>
  `;
}

function renderCaptures() {
  const subVideo      = activeSub === 'video'      ? 'active' : '';
  const subKeogram    = activeSub === 'keogram'    ? 'active' : '';
  const subStartrails = activeSub === 'startrails' ? 'active' : '';
  const subHighlights = activeSub === 'highlights' ? 'active' : '';
  const subImages     = activeSub === 'images'     ? 'active' : '';

  document.getElementById('captures-content').innerHTML = `
    ${renderCalendar()}
    <div class="sub-tabs">
      <button class="${subVideo}"      onclick="selectSub('video')">Video</button>
      <button class="${subKeogram}"    onclick="selectSub('keogram')">Keogram</button>
      <button class="${subStartrails}" onclick="selectSub('startrails')">Star Trails</button>
      <button class="${subHighlights}" onclick="selectSub('highlights')">Highlights</button>
      <button class="${subImages}"     onclick="selectSub('images')">Images</button>
    </div>
    <div id="date-content"><div class="spinner"></div></div>
  `;
}

async function selectDate(date) {
  activeDate = date;
  renderCaptures();
  await loadDateContent(date);
}

function selectSub(sub) {
  activeSub = sub;
  renderCaptures();
  renderDateContent(activeDate);
}

async function loadDateContent(date) {
  if (dateImages[date]) {
    renderDateContent(date);
    return;
  }

  const el = document.getElementById('date-content');
  if (el) el.innerHTML = '<div class="spinner"></div>';

  try {
    const res = await fetch(`/api/captures/${encodeURIComponent(date)}/images`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    dateImages[date] = await res.json();
  } catch (e) {
    if (el) el.innerHTML = `<div class="empty"><div class="empty-icon">⚠</div>Failed to load: ${esc(String(e))}</div>`;
    return;
  }

  renderDateContent(date);
}

function renderDateContent(date) {
  const el = document.getElementById('date-content');
  if (!el) return;

  const data = dateImages[date];
  if (!data) { el.innerHTML = '<div class="spinner"></div>'; return; }

  if (activeSub === 'images') {
    renderImages(el, data.images || []);
  } else if (activeSub === 'highlights') {
    renderHighlights(el, data.highlights || [], date, data.highlights_enabled !== false);
  } else if (activeSub === 'keogram') {
    renderKeogram(el, data.keogram, date);
  } else if (activeSub === 'startrails') {
    renderStarTrails(el, data.startrails, date);
  } else {
    renderVideo(el, data.video, date);
  }
}

/* Current image list for lightbox */
let lbImages = [];
let lbIdx    = 0;

const PAGE_SIZE = 50;

// Shared IntersectionObserver instance — recreated per renderImages call.
let thumbObs = null;

function observeThumb(el) {
  if (!thumbObs) return;
  thumbObs.observe(el);
}

function attachThumbObserver(container) {
  thumbObs = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const ph = entry.target;
      const src = ph.dataset.src;
      if (!src) return;
      thumbObs.unobserve(ph);

      const imgEl = document.createElement('img');
      imgEl.alt = '';
      imgEl.onload  = () => imgEl.classList.add('loaded');
      imgEl.onerror = () => {
        const err = document.createElement('div');
        err.className = 'img-placeholder';
        err.style.cssText = 'animation:none;background:var(--surface)';
        imgEl.replaceWith(err);
      };
      ph.replaceWith(imgEl); // in DOM before src so fetch starts immediately
      imgEl.src = src;
    });
  }, { rootMargin: '200px' });

  container.querySelectorAll('[data-src]').forEach(el => thumbObs.observe(el));
}

function renderImages(container, images) {
  if (images.length === 0) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">📷</div>No images for this date.</div>`;
    return;
  }

  lbImages = images;
  thumbObs = null;
  container.innerHTML = '';

  const grid = document.createElement('div');
  grid.className = 'img-grid';
  container.appendChild(grid);

  let loaded = 0;

  function appendPage() {
    const pageStart = loaded; // snapshot before incrementing
    const slice = images.slice(pageStart, pageStart + PAGE_SIZE);
    slice.forEach((img, i) => {
      const cell = document.createElement('div');
      cell.className = 'img-cell';
      cell.onclick = () => lbOpen(pageStart + i);
      cell.innerHTML = `
        <div class="img-placeholder" data-src="${esc(img.thumb_url)}"></div>
        <div class="img-overlay">${esc(img.time || '')}</div>`;
      grid.appendChild(cell);
    });
    loaded = pageStart + slice.length;

    // Wire up lazy-load observer for the newly added placeholders.
    if (thumbObs) {
      grid.querySelectorAll('[data-src]').forEach(el => {
        if (!el.dataset.observed) { el.dataset.observed = '1'; thumbObs.observe(el); }
      });
    } else {
      attachThumbObserver(grid);
      // Mark all initial placeholders so future pages don't double-observe.
      grid.querySelectorAll('[data-src]').forEach(el => el.dataset.observed = '1');
    }

    // Add / update "Load more" button.
    let btn = container.querySelector('.load-more-btn');
    if (loaded < images.length) {
      if (!btn) {
        btn = document.createElement('button');
        btn.className = 'load-more-btn';
        btn.onclick = appendPage;
        container.appendChild(btn);
      }
      btn.textContent = `Load more (${images.length - loaded} remaining)`;
    } else if (btn) {
      btn.remove();
    }
  }

  appendPage();
}

function renderHighlights(container, highlights, date, enabled = true) {
  if (!highlights || highlights.length === 0) {
    const hint = enabled
      ? "The night's best frames (stars × clear sky) are selected at dawn."
      : 'Highlights are disabled in the configuration (output.highlights.enabled).';
    container.innerHTML = `<div class="empty"><div class="empty-icon">✦</div>No highlights for ${esc(date)}.<br><span style="font-size:12px;color:var(--muted)">${hint}</span></div>`;
    return;
  }

  // Lightbox browses just the highlight set.
  lbImages = highlights;
  container.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'img-grid';
  highlights.forEach((hl, i) => {
    const cell = document.createElement('div');
    cell.className = 'img-cell';
    cell.onclick = () => lbOpen(i);
    cell.innerHTML = `
      <img src="${esc(hl.thumb_url)}" alt="" class="loaded" style="opacity:1">
      <div class="img-overlay" style="opacity:1">#${i + 1} · ${esc(hl.time)} · ${hl.stars}★ · ${Math.round(hl.cloud * 100)}%☁</div>`;
    grid.appendChild(cell);
  });
  container.appendChild(grid);
}

/* ── Lightbox ───────────────────────────────────────────── */
function lbOpen(idx) {
  lbIdx = idx;
  lbShow();
  document.getElementById('lightbox').classList.add('open');
}

function lbClose() {
  document.getElementById('lightbox').classList.remove('open');
}

function lbShow() {
  const img = lbImages[lbIdx];
  if (!img) return;
  document.getElementById('lb-img').src     = img.url;
  document.getElementById('lb-time').textContent = img.time || '';
  document.getElementById('lb-counter').textContent = `${lbIdx + 1} / ${lbImages.length}`;
}

function lbNav(dir) {
  lbIdx = (lbIdx + dir + lbImages.length) % lbImages.length;
  lbShow();
}

// Keyboard navigation
document.addEventListener('keydown', e => {
  const lb = document.getElementById('lightbox');
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape')      lbClose();
  if (e.key === 'ArrowLeft')   lbNav(-1);
  if (e.key === 'ArrowRight')  lbNav(1);
});

// Click outside image to close
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === document.getElementById('lightbox')) lbClose();
});

/* ── Live view ──────────────────────────────────────────── */
let liveInterval = null;
let liveAutoRefresh = true;
const LIVE_INTERVAL_MS = 5000;

function showTab(name) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.main-tabs button').forEach(b => b.classList.remove('active'));
  document.getElementById('pane-' + name).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'captures' && !capturesLoaded) {
    loadCaptures(false);
  }
  if (name === 'live') {
    startLive();
  } else {
    stopLive();
  }
}

function startLive() {
  renderLiveShell();
  refreshLive();
  if (liveInterval) clearInterval(liveInterval);
  liveInterval = setInterval(() => {
    if (liveAutoRefresh) refreshLive();
  }, LIVE_INTERVAL_MS);
}

function stopLive() {
  if (liveInterval) { clearInterval(liveInterval); liveInterval = null; }
}

function renderLiveShell() {
  document.getElementById('live-content').innerHTML = `
    <div class="live-controls">
      <button class="btn" id="live-refresh-btn" onclick="refreshLive()">Refresh ↺</button>
      <button class="btn" id="live-auto-btn" onclick="toggleLiveAuto()">Auto-refresh: On</button>
      <span class="live-age" id="live-age"></span>
    </div>
    <div class="live-layout">
      <div>
        <div class="live-frame-wrap" id="live-frame-wrap">
          <div class="spinner"></div>
        </div>
      </div>
      <div class="metrics-card" id="live-metrics">
        <div class="card-title">Capture Metrics</div>
        <div class="spinner"></div>
      </div>
    </div>
  `;
}

async function refreshLive() {
  // Load the latest frame — cache-bust with timestamp so browsers don't serve stale.
  const frameWrap = document.getElementById('live-frame-wrap');
  if (frameWrap) {
    const ts = Date.now();
    const img = new Image();
    img.onload = () => {
      frameWrap.innerHTML = '';
      frameWrap.appendChild(img);
    };
    img.onerror = () => {
      frameWrap.innerHTML = `<div class="live-offline"><div class="empty-icon" style="font-size:32px;margin-bottom:8px">📷</div>No image available</div>`;
    };
    img.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block;';
    img.src = `/latest?w=1024&_=${ts}`;
  }

  // Load metrics.
  const metricsEl = document.getElementById('live-metrics');
  try {
    const res = await fetch('/api/metrics');
    if (!res.ok) throw new Error('capture not running');
    const m = await res.json();

    const age = m.last_capture ? timeSince(new Date(m.last_capture)) : '—';
    const ageEl = document.getElementById('live-age');
    if (ageEl) ageEl.textContent = `Last frame: ${age}`;

    const cloudPct = Math.round((m.cloud_coverage || 0) * 100);
    const modeBadge = m.mode === 'night'
      ? `<span class="badge blue">night</span>`
      : `<span class="badge green">day</span>`;

    if (metricsEl) metricsEl.innerHTML = `
      <div class="card-title">Capture Metrics</div>
      ${metricRow('Mode',        modeBadge)}
      ${metricRow('Exposure',    `<span class="mono">${esc(m.exposure || '—')}</span>`)}
      ${metricRow('Gain',        `<span class="mono">${(m.gain || 0).toFixed(1)}</span>`)}
      ${metricRow('Brightness',  `<span class="mono">${(m.mean_brightness || 0).toFixed(1)}</span>`)}
      ${metricRow('Cloud cover', `<span class="mono">${cloudPct}%</span><span class="cloud-bar-wrap"><span class="cloud-bar" style="width:${cloudPct}%"></span></span>`)}
      ${metricRow('Stars',       m.star_count ? `<span class="mono">${m.star_count}</span>` : '—')}
      ${metricRow('Star FWHM',   m.star_fwhm ? `<span class="mono">${m.star_fwhm.toFixed(1)} px</span>` : '—')}
      ${metricRow('Green ratio', m.green_ratio ? `<span class="mono">${m.green_ratio.toFixed(2)}</span>` : '—')}
      ${metricRow('Moon',        moonRow(m))}
      ${metricRow('Sensor temp', m.sensor_temp_c ? `<span class="mono">${m.sensor_temp_c.toFixed(1)} °C</span>` : '—')}
      ${metricRow('Frames',      `<span class="mono">${(m.frame_count || 0).toLocaleString()}</span>`)}
      ${metricRow('Updated',     `<span class="mono">${timeSince(new Date(m.updated_at))}</span>`)}
    `;
  } catch {
    if (metricsEl) metricsEl.innerHTML = `
      <div class="card-title">Capture Metrics</div>
      <div style="color:var(--muted);font-size:13px;padding:16px 0;text-align:center">Capture not running</div>
    `;
    const ageEl = document.getElementById('live-age');
    if (ageEl) ageEl.textContent = '';
  }
}

function moonRow(m) {
  if (typeof m.moon_altitude !== 'number') return '—';
  const illum = Math.round((m.moon_illumination || 0) * 100);
  const state = m.moon_altitude > 0
    ? `up ${m.moon_altitude.toFixed(0)}°`
    : 'down';
  return `<span class="mono">${state} · ${illum}%</span>`;
}

function metricRow(label, value) {
  return `<div class="metric-row"><span class="metric-label">${label}</span><span class="metric-value">${value}</span></div>`;
}

function timeSince(date) {
  if (!date || isNaN(date)) return '—';
  const s = Math.round((Date.now() - date.getTime()) / 1000);
  if (s < 5)  return 'just now';
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  return `${Math.floor(s/3600)}h ago`;
}

function toggleLiveAuto() {
  liveAutoRefresh = !liveAutoRefresh;
  const btn = document.getElementById('live-auto-btn');
  if (btn) btn.textContent = `Auto-refresh: ${liveAutoRefresh ? 'On' : 'Off'}`;
}

/* ── Init ───────────────────────────────────────────────── */
checkStatus();
loadConfig();
startLive();
</script>
</body>
</html>
