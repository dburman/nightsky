# Nightsky Configuration
# Copy this file to nightsky.yaml and adjust for your setup.

camera:
  # Camera backend: "libcamera" (Raspberry Pi) or "zwo" (ZWO ASI USB cameras)
  type: libcamera
  # Device index (0 for first camera)
  device: 0
  # ZWO-specific: camera index when multiple ZWO cameras are connected
  index: 0
  # ZWO-specific: USB bandwidth limit (40-100, lower if sharing USB bus)
  usb_bandwidth: 80
  # Image flip: 0=none, 1=horizontal, 2=vertical, 3=both
  flip: 0

location:
  # Your geographic coordinates (used for day/night detection)
  latitude: 47.9158
  longitude: -91.7693
  # Sun altitude angle for day/night transition (degrees)
  # -6 = civil twilight (default), -12 = nautical, -18 = astronomical
  angle: -10
  # GPS auto-location: fetch lat/lon from a local gpsd daemon at startup.
  # Requires gpsd to be running (apt-get install gpsd). When a fix is
  # acquired, it overrides the latitude/longitude values above.
  gps: false
  gps_addr: "localhost:2947"

# Soft Go heap limit in MB (runtime GOMEMLIMIT). The GC collects aggressively
# as usage nears the limit instead of letting the kernel OOM killer pick a
# victim. Recommended ~250 on 512 MB boards (leaves headroom for ffmpeg).
# 0 = no limit. The GOMEMLIMIT environment variable takes precedence.
memory_limit_mb: 0

# Day mode settings (sun above angle threshold)
day:
  exposure: 1ms
  max_exposure: 6s
  gain: 1.0
  max_gain: 4.0
  auto_exposure: true
  target_brightness: 100
  delay: 600s
  binning: 1
  wb_red: 2.30               # libcamera gain multiplier (0.0–10.0)
  wb_blue: 1.40
  awb: true
  image_type: png
  quality: 95
  skip_frames: 4
  denoise: cdn_fast
  # Metering zone for auto-exposure: "full", "center", or "top"
  metering_zone: full
  # Save a DNG file alongside each capture (libcamera / RPi only).
  # DNG preserves full sensor bit depth and Bayer pattern for post-processing.
  save_raw: false

# Night mode settings (sun below angle threshold)
# Tuned for the Sony IMX462 (Starvis) — a highly sensitive sensor that needs
# less gain than typical cameras. Reduce target_brightness if the sky background
# is too bright; lower max_gain if amp glow appears at the frame edges.
night:
  exposure: 4s
  max_exposure: 15.5s       # IMX462 maxes out at 15.5x
  gain: 2
  max_gain: 10.5            # IMX462 maxes out at 10.5x for analog gain
  auto_exposure: true
  target_brightness: 70     # IMX462 is very sensitive — keep sky background dark
  delay: 7s
  binning: 1
  wb_red: 2.30              # libcamera gain multiplier (0.0–10.0); tune with: nightsky analyze
  wb_blue: 1.40
  awb: false
  image_type: png
  quality: 95
  skip_frames: 2
  denoise: off
  # Metering zone for auto-exposure: "full", "center" (zenith), or "top"
  # "center" is recommended for upward-pointing all-sky cameras — it meters
  # the sky and ignores the lit ground/horizon at the frame edges.
  metering_zone: center
  # Save a DNG file alongside each capture (libcamera / RPi only).
  # DNG preserves full sensor bit depth and Bayer pattern for post-processing
  # in Lightroom, darktable, RawTherapee, etc. DNGs are kept during raw prune.
  save_raw: false
  # Raise the auto-exposure target while the moon is up, proportionally to
  # its illuminated fraction: target × (1 + boost × illumination). Stops the
  # controller fighting moonlight with maximum gain. 0 = off; try 0.5.
  moon_target_boost: 0.0
  # ZWO cooler settings (ignored for RPi cameras)
  cooler_enabled: false
  cooler_target: -10

output:
  # Base directory for captured images. Images saved to <dir>/YYYY-MM-DD/
  directory: ./output
  # Filename prefix for images
  filename_prefix: sky
  # --- Disk space management ---
  #
  # Strategy 1 — prune raw images after N days (recommended for long-term use):
  # After N days, raw captured images are deleted from a night directory but the
  # synthesized outputs (timelapse, keogram, star trails, WB analysis) are kept.
  # Use this to retain a permanent record of each night's highlights while
  # reclaiming the bulk of the storage. 0 = disabled.
  prune_raw_after_days: 0
  #
  # Strategy 2 — full directory deletion (choose one approach below, or combine
  # with prune_raw_after_days to delete entire directories after even longer):
  #
  # Option A — space-based (recommended): delete oldest nights first, only when
  # the disk is getting full. Today's directory is never removed.
  # Example: keep at least 5 GB free at all times.
  min_free_gb: 8
  #
  # Option B — time-based: delete directories older than N days regardless of
  # available space. 0 = disabled.
  days_to_keep: 0
  # Where the live .metrics.json is written (rewritten after every frame).
  # Point at tmpfs to avoid constant small writes wearing the SD card —
  # e.g. /run/nightsky with RuntimeDirectory=nightsky in the systemd unit.
  # "" = the output directory. Capture and serve must use the same value.
  metrics_dir: ""

  # Overlay timestamp and metadata on images
  overlay: true
  overlay_font_size: 24

  # EXPERIMENTAL: single switch for raw mode (libcamera only).
  #   true  = capture DNGs (save_raw implied for both modes) and process each
  #           frame from the linear raw: decode, subtract raw master dark,
  #           meter, debayer. Falls back to the standard image on any
  #           per-frame error. Linear metering reads darker than the display
  #           mean — retune target_brightness when enabling.
  #   false = run exactly as before; none of the raw pipeline code executes.
  raw_calibration: false

  # Histogram stretch — increases contrast on faint night-sky images.
  # Applies a linear remap of [black_point, white_point] → [0, 255].
  # Does not affect raw scientific data; only changes the saved JPEG/PNG appearance.
  stretch:
    enabled: false
    # "auto" derives black/white points from percentiles of the frame luminance.
    # "manual" uses the black_point / white_point values below.
    mode: manual
    # Auto mode percentiles — tune these to improve star visibility:
    #   auto_black_percentile: higher = sky goes darker = more stars visible.
    #     Dark sites (Bortle 1-3): 10–15. Light-polluted sites: 2–5.
    #   auto_white_percentile: higher = more headroom before bright stars clip.
    #     99.9 preserves stars well; lower values boost overall brightness.
    auto_black_percentile: 10    # 10th percentile — good for dark skies
    auto_white_percentile: 99.9  # 99.9th percentile — preserves star brightness
    black_point: 15  # manual mode only
    white_point: 220 # manual mode only

  # Per-output enable flags — set to false to skip that step at end of night.
  keogram:
    enabled: true
  startrails:
    enabled: true
    # Skip generation when the moon was up most of the night and >40%
    # illuminated (moonlight washes out trails). Default off.
    skip_moonlit: false

  timelapse:
    enabled: true
    fps: 25
    codec: libx265          # libx264, libx265, libaom-av1, libsvtav1
    # Quality — choose CRF or bitrate (CRF takes precedence when non-zero):
    # CRF (recommended): 18–23 for libx264, 23–28 for libx265, 30–45 for AV1. Lower = better.
    crf: 23
    bitrate: 2000k          # used only when crf is 0
    # Encoder preset: speed/efficiency trade-off. Slower = smaller at equal
    # quality. x264/x265 use names (e.g. "slow"); SVT-AV1 uses "0"–"13"
    # (6–8 is a good Pi balance). "" = encoder default.
    preset: ""
    # Max keyframe interval in frames. A long GOP shrinks a static-camera
    # timelapse; try 250 (~10s at 25fps). 0 = encoder default.
    gop: 0
    # Encoder -tune value (codec-specific). "" = none.
    tune: ""
    # Cap encoder threads (-threads, plus lp=N for SVT-AV1). Fewer threads =
    # lower peak memory and a smaller CPU/power spike. Recommended: 2 on
    # low-memory boards (Pi Zero 2). 0 = encoder default.
    threads: 0
    # Defer encode start while the SoC is hotter than this (°C), rechecking
    # every 2 minutes for up to 30 minutes. Keeps encode heat off an
    # already-hot chip (thermal capping, SDIO WiFi instability). Recommended
    # 70 on Pi-class hardware. 0 = disabled.
    thermal_limit_c: 0
    # Deflicker: smooth per-frame brightness variation caused by clouds and
    # auto-exposure steps. Recommended for night timelapses. Only effective
    # with segment_frames: 0 (it can't smooth across stream-copied segments).
    deflicker: true
    # Iterative mode: encode a segment every N frames throughout the night,
    # then stream-copy the segments together at dawn (fast, no re-encode).
    # 0 (default) encodes the full timelapse at end of night.
    segment_frames: 0

  # End-of-night PNG → WebP conversion (requires: apt-get install webp)
  webp:
    enabled: true
    # Lossy quality 0–100 (85 is a good balance of size vs. quality)
    quality: 85
    # Remove the original PNG after successful conversion
    delete_originals: true

upload:
  # Upload each captured image (can be bandwidth-heavy)
  upload_images: false
  # Upload timelapse video at end of night
  upload_timelapse: false

  s3:
    enabled: false
    bucket: my-allsky-bucket
    region: us-east-1
    # S3 key prefix
    prefix: nightsky
    # Custom endpoint for S3-compatible services (MinIO, Backblaze B2, etc.)
    # endpoint: https://s3.us-east-005.backblazeb2.com

  http:
    enabled: false
    url: https://example.com/upload
    # Authorization header (e.g., "Bearer <token>")
    # authorization: Bearer mytoken

dark:
  # Enable dark frame subtraction
  enabled: false
  # Directory to store dark frames
  directory: ./darks
  # Number of dark frames to average
  count: 5

flat:
  # Enable flat-field correction for lens vignetting. Run "nightsky flat" to
  # capture the master flat (point camera at a uniformly lit surface first).
  enabled: false
  # Directory to store the master flat frame
  directory: ./flats
  # Number of flat frames to average into the master flat
  count: 10

# Push notifications via webhook. The wire format is ntfy-compatible (message
# body + Title header): create a topic at https://ntfy.sh, put its URL here,
# and install the ntfy app to receive alerts on your phone.
alerts:
  webhook_url: ""            # e.g. https://ntfy.sh/my-secret-astrocam-topic
  base_url: ""               # optional, for links in messages, e.g. http://astrocam:8080
  # Send a dawn summary: frames, clear-sky stats, peak stars, aurora events.
  night_summary: false
  # Aurora detection: alerts when the sky's green ratio exceeds its rolling
  # baseline for several consecutive clear frames. One alert per surge.
  aurora:
    enabled: false
    ratio_threshold: 1.3     # green ratio must exceed baseline × this
    min_frames: 3            # consecutive anomalous frames before alerting
    max_cloud: 0.5           # suppress detection above this cloud coverage
